<!doctype html><html lang="zh"><meta charset="utf-8"><title>移动落点动画逐帧检查</title><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><style>body{margin:0;background:#142c35;color:#e2d7b6;font:16px sans-serif}h1{margin:16px;font-size:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr)}.cell{position:relative;height:400px;border:1px solid #45646a}.cell p{position:absolute;left:16px;top:8px}canvas{width:100%;height:100%}</style><h1>原始右键移动标记 · 0.4 秒动画（同一落点、不放大为圆圈）</h1><div class="grid"></div><script type="module">
import * as THREE from 'three';import{NativeTargeting}from'./native-targeting.js';import{gameToNative}from'./original-map.js';
for(const time of [.02,.12,.24,.36]){const cell=document.createElement('div');cell.className='cell';cell.innerHTML='<p>'+time.toFixed(2)+' 秒</p>';document.querySelector('.grid').append(cell);const r=new THREE.WebGLRenderer({antialias:true});r.setSize(cell.clientWidth,400);cell.append(r.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#2b454c');const world=new THREE.Group();world.scale.z=-1;scene.add(world);const n=gameToNative(1600,0),camera=new THREE.PerspectiveCamera(40,cell.clientWidth/400,1,2000);camera.position.set(n.x,420,-n.z+330);camera.lookAt(n.x,10,-n.z);const grid=new THREE.GridHelper(500,20,0x5d777c,0x375258);grid.position.set(n.x,-1,-n.z);scene.add(grid);const ui=new NativeTargeting({world,map:{navigation:{height:()=>0}}});await ui.load();const move={type:'move',x:1600,y:0,max:.4,life:.4-time};ui.update({player:{alive:true,x:1600,y:0},effects:[move]},null,{x:1600,y:0},0);r.render(scene,camera);}
</script></html>
