<!doctype html><html lang="zh"><meta charset="utf-8"><title>草丛材质验收</title><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><style>body{margin:0;background:#24394f;color:#eef4fc;font:15px sans-serif}header{height:70px;box-sizing:border-box;padding:10px 18px;display:flex;align-items:center;gap:15px}button,select{padding:8px;font:inherit}canvas{display:block}#status{font-size:13px}</style><header><strong>草丛材质</strong><select id="patch" aria-label="草丛区域"></select><button id="before">导出缺失材质（修复前）</button><button id="after">恢复材质</button><span id="status">正在加载地图…</span></header><script type="module">
import * as THREE from 'three';import {OriginalMap,nativeToGame}from'./original-map.js?v=grass-1';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.setPixelRatio(1);document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x24394f);scene.fog=new THREE.Fog(0x24394f,9000,30000);const world=new THREE.Group();world.scale.z=-1;scene.add(world);
const status=document.getElementById('status'),map=new OriginalMap(message=>status.textContent=message),patches=[];
const missing=new THREE.MeshStandardMaterial({color:0xffffff,metalness:1,roughness:1,side:THREE.DoubleSide,vertexColors:true});let mode='after';
function draw(){const index=Number(document.getElementById('patch').value)||0,object=patches[index],box=new THREE.Box3().setFromBufferAttribute(object.geometry.attributes.position),center=box.getCenter(new THREE.Vector3()),cam=nativeToGame(center.x,center.z);renderer.setSize(innerWidth,innerHeight-70);map.updateCamera({w:innerWidth,h:innerHeight-70,cam,zoom:1.35});for(const p of patches)p.material=mode==='before'?missing:p.userData.restored;renderer.render(scene,map.camera);status.textContent=`${mode==='before'?'缺失材质':'材质'} · 区域 ${index+1}/${patches.length} · ${object.name} · ${object.material.type} · 贴图 ${object.material.map?'已绑定':'缺失'}`;document.body.dataset.ready='true';}
try{await map.load(world);map.terrain.traverse(o=>{if(o.isMesh&&String(o.material.name).endsWith('/Wall_of_Grass')){o.userData.restored=o.material;patches.push(o);}});document.getElementById('patch').replaceChildren(...patches.map((o,i)=>{const option=document.createElement('option');option.value=i;option.textContent='草丛区域 '+(i+1);return option;}));document.getElementById('patch').value=3;document.getElementById('patch').onchange=draw;document.getElementById('before').onclick=()=>{mode='before';draw();};document.getElementById('after').onclick=()=>{mode='after';draw();};addEventListener('resize',draw);draw();}catch(e){status.textContent='加载失败：'+e.message;console.error(e);}
</script></html>
