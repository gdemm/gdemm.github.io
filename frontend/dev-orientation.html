<!doctype html><html lang="zh"><meta charset="utf-8"><title>技能箭头朝向回归</title><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><style>body{margin:0;background:#10252f;color:#e3dabd;font:14px sans-serif}h1{font-size:18px;margin:14px}#grid{display:grid;grid-template-columns:repeat(3,1fr)}.cell{position:relative;height:310px;border:1px solid #48636d}.cell p{position:absolute;left:12px;top:0;z-index:1}canvas{display:block;width:100%;height:100%}button{margin:8px;padding:8px}</style><h1>绿色箭头 = 实际飞行方向；只显示原始弹体模型，不用坐标轴代替箭头本身</h1><button id="turn">转向 90°</button><div id="grid"></div><script type="module">
import * as THREE from 'three';import {OriginalVfx}from'./original-vfx.js';import{gameToNative}from'./original-map.js';
const data=await fetch('assets/vfx/manifest.json').then(r=>r.json()),n=gameToNative(1600,0),cases=[['寒冰 R','Ashe_Base_R_mis','icearrow'],['寒冰 W','Ashe_Base_W_mis','icearrow'],['伊泽瑞尔 R','Ezreal_Base_R_mis','Mesh'],['金克丝 R','Jinx_Base_R_Mis','Missle'],['金克丝火箭','Jinx_Base_Q_Rocket_mis','missle'],['阿狸 E','Ahri_Base_E_mis','HeartMesh_ALPHA2']],views=[];let angle=0;
for(const[label,name,emitter]of cases){const cell=document.createElement('div');cell.className='cell';cell.innerHTML='<p>'+label+'</p>';document.getElementById('grid').append(cell);const r=new THREE.WebGLRenderer({antialias:true});r.setSize(cell.clientWidth,310);cell.append(r.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#25434f');const world=new THREE.Group();world.scale.z=-1;scene.add(world);const cam=new THREE.OrthographicCamera(-430,430,340,-340,1,5000);cam.position.set(n.x,1800,-n.z);cam.up.set(0,0,-1);cam.lookAt(n.x,0,-n.z);const owner={world,camera:cam,map:{w:cell.clientWidth,h:310,navigation:{height:()=>0}}},fx=new OriginalVfx(owner,()=>{});fx.ready=true;fx.data=data;const e=data.effects[name].emitters.find(e=>e.emitterName===emitter);for(const url of[e.textureUrl,e.multUrl,e.paletteUrl].filter(Boolean)){const t=await new THREE.TextureLoader().loadAsync(url);t.colorSpace=THREE.SRGBColorSpace;fx.textures.set(url,t);}if(e.meshUrl){const m=await fetch(e.meshUrl).then(r=>r.json()),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(m.position,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(m.uv,2));fx.meshes.set(e.meshUrl,g);}views.push({fx,world,r,scene,cam,name,e});}
function draw(){for(const v of views){v.fx.reset(null);if(v.arrow)v.world.remove(v.arrow);v.arrow=new THREE.ArrowHelper(new THREE.Vector3(Math.sin(angle),0,Math.cos(angle)),new THREE.Vector3(n.x-220,40,n.z-100),200,0x75ffad,30,15);v.world.add(v.arrow);v.fx.emit(v.name,v.fx.host(1600,0,angle),1);v.fx.makeParticle(v.fx.instances[0],v.e);for(const p of v.fx.particles)v.fx.updateParticle(p,.18);v.r.render(v.scene,v.cam);}}document.getElementById('turn').onclick=()=>{angle+=Math.PI/2;draw();};draw();document.body.dataset.ready='true';
</script></html>
