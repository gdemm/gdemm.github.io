<!doctype html><html lang="zh"><meta charset="utf-8"><title>本地技能逐帧检查</title><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><style>body{margin:0;overflow:hidden;background:#182d39;color:#e0d6bc;font:14px sans-serif}header{padding:12px;display:flex;gap:12px;align-items:center}select,button{font:inherit;padding:6px;background:#10222e;color:#e0d6bc;border:1px solid #987e4b}canvas{display:block}#status{padding:10px}</style><header><strong>技能 · 逐帧检查</strong><select id="hero" aria-label="英雄"><option>Ahri</option><option>Lux</option><option>Ashe</option><option>Ezreal</option><option>Jinx</option><option>Garen</option></select><select id="skill" aria-label="技能"><option value="0">Q</option><option value="1">W</option><option value="2">E</option><option value="3">R</option><option value="4">闪现</option><option value="5">治疗</option></select><button data-time="0.1">0.1 秒</button><button data-time="0.3">0.3 秒</button><button data-time="0.6">0.6 秒</button><button data-time="1">1 秒</button><button data-time="1.5">1.5 秒</button><button data-time="2">2 秒</button></header><div id="status">加载特效…</div><script type="module">
import * as THREE from 'three';import {OriginalVfx}from'./original-vfx.js';import {Game,HEROES}from'./engine.js';import{configureHero,updateCombat,updateMissile,updateHeroCombat}from'./native-combat.js';import{MAP_CONFIG,gameToNative}from'./original-map.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight-95);document.body.append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#29424d');const world=new THREE.Group();world.scale.z=-1;scene.add(world);const origin=gameToNative(1600,0),camera=new THREE.PerspectiveCamera(42,innerWidth/(innerHeight-95),1,20000);camera.position.set(origin.x,1800,-origin.z+1300);camera.lookAt(origin.x+220,100,-origin.z);const grid=new THREE.GridHelper(3500,28,0x60838b,0x38535f);grid.position.set(origin.x,0,-origin.z);scene.add(grid);const owner={world,camera,map:{navigation:{height:()=>0},w:innerWidth,h:innerHeight-95}},vfx=new OriginalVfx(owner,()=>{});await vfx.load();
function draw(time){const hero=HEROES.find(h=>h.id===document.getElementById('hero').value),g=new Game(hero);g.mapConfig=MAP_CONFIG;g.units=[g.player];const u=g.player;u.x=1600;u.y=0;u.level=6;u.asheFocus=4;configureHero(g,u);u.asheFocus=4;const target={id:999,x:1600+700/MAP_CONFIG.scale,y:0,hp:99999,maxHp:99999,team:1,alive:true,kind:'hero',radius:20,shield:0,stun:0,slow:0,hero:{id:'Target'}};g.units.push(target);let i=Number(document.getElementById('skill').value),aim={x:1600+970/MAP_CONFIG.scale,y:0};if(hero.id==='Garen'&&i===3){target.x=1600+250/MAP_CONFIG.scale;aim=target;}vfx.reset(g);g.cast(i,aim);for(let t=0;t<time;t+=.01){g.time+=.01;updateHeroCombat(g,u,.01);updateCombat(g,.01);for(const p of g.projectiles)if(p.life>0)updateMissile(g,p,.01);g.projectiles=g.projectiles.filter(p=>p.life>0);vfx.update(g,.01);}renderer.render(scene,camera);document.getElementById('status').textContent=hero.id+' · '+['Q','W','E','R','闪现','治疗'][i]+' · '+time.toFixed(2)+' 秒 · 弹道 '+g.projectiles.length+' · 粒子 '+vfx.particles.length+' · 拖尾 '+vfx.particles.filter(p=>p.ribbon).length+' · 陷阱模型 '+vfx.traps.size;}
for(const b of document.querySelectorAll('[data-time]'))b.onclick=()=>draw(Number(b.dataset.time));document.getElementById('hero').onchange=()=>draw(.3);document.getElementById('skill').onchange=()=>draw(.3);draw(.3);
</script></html>
